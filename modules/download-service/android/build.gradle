plugins {
  id 'com.android.library'
  id 'kotlin-android'
  id 'expo-module-gradle-plugin'
}

expoModule {
  canBePublished false
}

android {
  namespace 'expo.modules.downloadservice'
  compileSdk 35
  defaultConfig {
    minSdk 24
  }
}

dependencies {
  // HeadlessJsTaskContext keeps JS timers running while the app is backgrounded.
  implementation 'com.facebook.react:react-android'
}
